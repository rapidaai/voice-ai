<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var mode;

        try {
          var cachedTheme = JSON.parse(
            localStorage.getItem('ui-theme-manifest') || 'null',
          );
          var storedMode = localStorage.getItem('ui-theme-mode');
          var canSelectMode = cachedTheme?.allowModeSelection !== false;
          var defaultMode = cachedTheme?.defaultMode;

          if (
            canSelectMode &&
            (storedMode === 'light' || storedMode === 'dark')
          ) {
            mode = storedMode;
          } else if (defaultMode === 'light' || defaultMode === 'dark') {
            mode = defaultMode;
          }
        } catch {
          mode = undefined;
        }

        if (!mode) {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }

        document.documentElement.setAttribute('data-color-mode', mode);

        if (cachedTheme?.id) {
          document.documentElement.setAttribute('data-brand', cachedTheme.id);
        }

        var colors = cachedTheme?.colors?.[mode];
        if (colors) {
          document.documentElement.style.setProperty(
            '--brand-primary',
            colors.primary,
          );
          document.documentElement.style.setProperty(
            '--brand-primary-hover',
            colors.primaryHover,
          );
          document.documentElement.style.setProperty(
            '--brand-primary-active',
            colors.primaryActive,
          );
          document.documentElement.style.setProperty(
            '--brand-on-primary',
            colors.onPrimary,
          );
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--  -->
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <title>Voice AI Console</title>
  </head>
  <body class="bg-surface text-foreground antialiased">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
