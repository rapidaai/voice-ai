name: Reusable UI CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install.
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        description: Optional Codecov token.
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: UI Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up UI
        uses: ./.github/actions/setup-ui
        with:
          node-version: ${{ inputs.node-version }}

      - name: Check theme contract
        working-directory: ui
        run: yarn check:theme-contract

      - name: Test theme contract checker
        working-directory: ui
        run: yarn test:theme-contract

      - name: Test bundle-size checker
        working-directory: ui
        run: yarn test:bundle-size

      - name: Test TypeScript baseline checker
        working-directory: ui
        run: yarn test:typescript-check
      - name: Check public assets
        working-directory: ui
        run: yarn check:public-assets

      - name: Test public asset checker
        working-directory: ui
        run: yarn test:public-assets

      - name: Check UI dependencies
        working-directory: ui
        run: yarn check:dependencies

      - name: Run ESLint
        working-directory: ui
        run: yarn lint

      - name: Run Stylelint
        working-directory: ui
        run: yarn lint:css

  typecheck:
    name: UI Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up UI
        uses: ./.github/actions/setup-ui
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run TypeScript
        working-directory: ui
        run: yarn checkTs

  test:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up UI
        uses: ./.github/actions/setup-ui
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run tests with coverage
        working-directory: ui
        run: yarn test --watchAll=false --passWithNoTests --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: ./ui/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  browser:
    name: UI Browser Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up UI
        uses: ./.github/actions/setup-ui
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Chromium
        working-directory: ui
        run: yarn playwright install --with-deps chromium

      - name: Run browser accessibility and screenshot checks
        working-directory: ui
        run: yarn test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-browser-failures
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: UI Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up UI
        uses: ./.github/actions/setup-ui
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build
        working-directory: ui
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true
        run: yarn build

      - name: Enforce bundle-size budgets
        working-directory: ui
        run: yarn check:bundle-size
