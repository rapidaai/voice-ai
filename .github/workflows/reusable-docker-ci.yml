name: Reusable Docker CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - web-api
          - integration-api
          - endpoint-api
          - assistant-api
          - ui
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build ${{ matrix.service }}
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: ./docker/${{ matrix.service }}/Dockerfile
          push: "false"
          tags: rapida/${{ matrix.service }}:test
          cache-scope: ci-${{ matrix.service }}
