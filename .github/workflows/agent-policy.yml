name: Agent Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Agent Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: "1.58.0"

      - name: Validate pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 -c 'import os, pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr-body.md").write_text(os.environ.get("PR_BODY", ""), encoding="utf-8")'
          python3 bin/check-pr-body --body-file "$RUNNER_TEMP/pr-body.md" --title "$PR_TITLE"

      - name: Validate agent tooling and generated rules
        run: just validate-development-toolkit

      - name: Validate changed prose and identifiers
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 bin/check-agent-style --range "${PR_BASE_SHA}...${PR_HEAD_SHA}"
