name: Reusable Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: Go version to install.
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        description: Optional Codecov token.
        required: false

permissions:
  contents: read

env:
  GO_CI_PACKAGES: >-
    ./api/web-api/...
    ./api/integration-api/...
    ./api/endpoint-api/...
    ./pkg/...
    ./cmd/web/...
    ./cmd/integration/...
    ./cmd/endpoint/...
    ./config/...

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: 0
        with:
          version: v2.12.2
          args: --timeout=5m --build-tags=nocgo ${{ env.GO_CI_PACKAGES }}

  format:
    name: Go Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}
          download-dependencies: "false"

      - name: Check gofmt
        run: |
          unformatted=$(find . -name '*.go' -not -path './protos/*' -not -path './sdks/*' -not -path './vendor/*' -print0 | xargs -0 gofmt -l 2>/dev/null || true)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo ""
            echo "Run gofmt -w on the listed files and commit the result."
            exit 1
          fi

  package-load:
    name: Go Package Load
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}

      - name: Load package graph
        env:
          CGO_ENABLED: 1
        run: |
          read -r -a packages <<< "$GO_CI_PACKAGES"
          go list -deps -test "${packages[@]}" > /dev/null

  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run go vet
        env:
          CGO_ENABLED: 0
        run: |
          read -r -a packages <<< "$GO_CI_PACKAGES"
          go vet "${packages[@]}"

  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run tests with coverage
        env:
          CGO_ENABLED: 1
        run: |
          read -r -a packages <<< "$GO_CI_PACKAGES"
          go test -v -coverprofile=coverage.out -covermode=atomic "${packages[@]}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  race-test:
    name: Go Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run race detector
        env:
          CGO_ENABLED: 1
        run: |
          read -r -a packages <<< "$GO_CI_PACKAGES"
          go test -race -count=1 "${packages[@]}"

  build:
    name: Go Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - web
          - integration
          - endpoint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}

      - name: Build ${{ matrix.service }}
        env:
          CGO_ENABLED: 0
          GOOS: linux
        run: go build -trimpath -ldflags="-s -w" -o bin/${{ matrix.service }}-api ./cmd/${{ matrix.service }}/${{ matrix.service }}.go

  mod-tidy:
    name: Go Mod Tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}

      - name: Verify downloaded modules
        run: go mod verify

      - name: Check go.mod and go.sum
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy. Run go mod tidy and commit changes."
            git diff -- go.mod go.sum
            exit 1
          fi

  vulnerability-scan:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run govulncheck
        env:
          CGO_ENABLED: 0
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          read -r -a packages <<< "$GO_CI_PACKAGES"
          govulncheck "${packages[@]}"
