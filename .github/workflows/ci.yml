name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.13"
  NODE_VERSION: "22"

jobs:
  go:
    name: Go
    uses: ./.github/workflows/reusable-go-ci.yml
    secrets: inherit
    with:
      go-version: "1.25.13"

  ui:
    name: UI
    uses: ./.github/workflows/reusable-ui-ci.yml
    secrets: inherit
    with:
      node-version: "22"

  repository:
    name: Repository
    uses: ./.github/workflows/reusable-repository-ci.yml
    with:
      node-version: "22"

  docker:
    name: Docker
    uses: ./.github/workflows/reusable-docker-ci.yml

  # Stabilization lanes report independently until the RFC graduation thresholds
  # are met. They intentionally remain outside ci-success, and Docker CI remains.
  assistant-native:
    name: Assistant Native (stabilizing)
    uses: ./.github/workflows/reusable-assistant-native-ci.yml

  system:
    name: System (stabilizing)
    uses: ./.github/workflows/reusable-system-ci.yml

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    # Graduation: add each lane only after its RFC sample passes. When system
    # graduates, remove docker here and remove the standalone docker job above.
    needs:
      - go
      - ui
      - repository
      - docker
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "Some checks failed"
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Some checks were cancelled"
            exit 1
          fi
          echo "All checks passed"

      - name: Summary
        run: |
          {
            echo "## CI Results"
            echo ""
            echo "| Area | Result |"
            echo "|------|--------|"
            echo "| Go | ${{ needs.go.result }} |"
            echo "| UI | ${{ needs.ui.result }} |"
            echo "| Repository | ${{ needs.repository.result }} |"
            echo "| Docker | ${{ needs.docker.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
