name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.13"
  NODE_VERSION: "22"

jobs:
  changes:
    name: 00 Changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          full=true
          mode=full

          if [ "$EVENT_NAME" != "workflow_dispatch" ] &&
             [ -n "$BASE_SHA" ] &&
             [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
             git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              mapfile -d '' changed_files < <(git diff --name-only -z "$BASE_SHA...$HEAD_SHA")
            else
              mapfile -d '' changed_files < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
            fi

            if [ "${#changed_files[@]}" -gt 0 ]; then
              full=false
              mode=documentation
              for path in "${changed_files[@]}"; do
                case "$path" in
                  *.md | docs/* | rfcs/*) ;;
                  *)
                    full=true
                    mode=full
                    break
                    ;;
                esac
              done
            fi
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "CI mode: $mode" >> "$GITHUB_STEP_SUMMARY"

  commit-lint:
    name: 01 Validate - Repository / Commit Message Lint
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install commitlint
        run: npm install --global @commitlint/cli @commitlint/config-conventional

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  basics-go:
    name: 01 Validate - Go
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/reusable-go-ci.yml
    secrets: inherit
    with:
      go-version: "1.25.13"

  basics-ui:
    name: 01 Validate - UI
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/reusable-ui-ci.yml
    secrets: inherit
    with:
      node-version: "22"

  basics-repository:
    name: 01 Validate - Repository
    needs: changes
    uses: ./.github/workflows/reusable-repository-ci.yml
    with:
      go-version: "1.25.13"

  docker:
    name: 02 Build - Docker Images
    needs:
      - changes
      - basics-go
      - basics-ui
      - basics-repository
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/reusable-docker-ci.yml

  single-service:
    name: 02 Build - Assistant Native
    needs:
      - changes
      - basics-go
      - basics-ui
      - basics-repository
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/reusable-assistant-native-ci.yml

  end-to-end:
    name: 03 End-to-End Verification
    needs: docker
    uses: ./.github/workflows/reusable-end-to-end-ci.yml

  ci-success:
    name: 05 CI Complete
    runs-on: ubuntu-latest
    needs:
      - changes
      - commit-lint
      - basics-go
      - basics-ui
      - basics-repository
      - docker
      - single-service
      - end-to-end
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          CI_MODE: ${{ needs.changes.outputs.mode }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          COMMIT_LINT_RESULT: ${{ needs.commit-lint.result }}
          GO_RESULT: ${{ needs.basics-go.result }}
          UI_RESULT: ${{ needs.basics-ui.result }}
          REPOSITORY_RESULT: ${{ needs.basics-repository.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          NATIVE_RESULT: ${{ needs.single-service.result }}
          END_TO_END_RESULT: ${{ needs.end-to-end.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ] || [ "$REPOSITORY_RESULT" != "success" ]; then
            echo "Change classification and repository validation must pass"
            exit 1
          fi

          if [ "$COMMIT_LINT_RESULT" != "success" ] && [ "$COMMIT_LINT_RESULT" != "skipped" ]; then
            echo "Commit message validation must pass"
            exit 1
          fi

          case "$CI_MODE" in
            full)
              for result in "$GO_RESULT" "$UI_RESULT" "$DOCKER_RESULT" "$NATIVE_RESULT" "$END_TO_END_RESULT"; do
                if [ "$result" != "success" ]; then
                  echo "Every full CI stage must pass"
                  exit 1
                fi
              done
              ;;
            documentation)
              for result in "$GO_RESULT" "$UI_RESULT" "$DOCKER_RESULT" "$NATIVE_RESULT" "$END_TO_END_RESULT"; do
                if [ "$result" != "skipped" ]; then
                  echo "Heavy CI stages must be skipped for documentation-only changes"
                  exit 1
                fi
              done
              ;;
            *)
              echo "Unknown CI mode: $CI_MODE"
              exit 1
              ;;
          esac

          echo "All required checks passed in $CI_MODE mode"

      - name: Summary
        run: |
          {
            echo "## CI Results"
            echo ""
            echo "| Area | Result |"
            echo "|------|--------|"
            echo "| 00 Changes (${{ needs.changes.outputs.mode }}) | ${{ needs.changes.result }} |"
            echo "| 01 Validate - Repository / Commit Message Lint | ${{ needs.commit-lint.result }} |"
            echo "| 01 Validate - Go | ${{ needs.basics-go.result }} |"
            echo "| 01 Validate - UI | ${{ needs.basics-ui.result }} |"
            echo "| 01 Validate - Repository | ${{ needs.basics-repository.result }} |"
            echo "| 02 Build - Docker Images | ${{ needs.docker.result }} |"
            echo "| 02 Build - Assistant Native | ${{ needs.single-service.result }} |"
            echo "| 03 End-to-End Verification | ${{ needs.end-to-end.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
