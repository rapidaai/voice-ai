name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.13"
  NODE_VERSION: "22"

jobs:
  basics-go:
    name: 01 Basics - Go
    uses: ./.github/workflows/reusable-go-ci.yml
    secrets: inherit
    with:
      go-version: "1.25.13"

  basics-ui:
    name: 01 Basics - UI
    uses: ./.github/workflows/reusable-ui-ci.yml
    secrets: inherit
    with:
      node-version: "22"

  basics-repository:
    name: 01 Basics - Repository
    uses: ./.github/workflows/reusable-repository-ci.yml
    with:
      go-version: "1.25.13"
      node-version: "22"

  docker:
    name: 02 Docker Images
    needs:
      - basics-go
      - basics-ui
      - basics-repository
    uses: ./.github/workflows/reusable-docker-ci.yml

  single-service:
    name: 03 Single Service Verification
    needs: docker
    uses: ./.github/workflows/reusable-assistant-native-ci.yml

  end-to-end:
    name: 04 End-to-End Verification
    needs: single-service
    uses: ./.github/workflows/reusable-end-to-end-ci.yml

  ci-success:
    name: 05 CI Complete
    runs-on: ubuntu-latest
    needs:
      - basics-go
      - basics-ui
      - basics-repository
      - docker
      - single-service
      - end-to-end
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "Some checks failed"
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Some checks were cancelled"
            exit 1
          fi
          echo "All checks passed"

      - name: Summary
        run: |
          {
            echo "## CI Results"
            echo ""
            echo "| Area | Result |"
            echo "|------|--------|"
            echo "| 01 Basics - Go | ${{ needs.basics-go.result }} |"
            echo "| 01 Basics - UI | ${{ needs.basics-ui.result }} |"
            echo "| 01 Basics - Repository | ${{ needs.basics-repository.result }} |"
            echo "| 02 Docker Images | ${{ needs.docker.result }} |"
            echo "| 03 Single Service Verification | ${{ needs.single-service.result }} |"
            echo "| 04 End-to-End Verification | ${{ needs.end-to-end.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
