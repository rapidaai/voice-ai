name: Reusable End-to-End CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  all-service-integration:
    name: All Service Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: rapida-integration-${{ github.run_id }}-${{ github.run_attempt }}
      CI_STACK_AUTH_TOKEN: ci-integration-${{ github.run_id }}-${{ github.run_attempt }}
      CI_STACK_CACHE_SCOPE: end-to-end-${{ github.run_id }}-${{ github.run_attempt }}
      CI_STACK_DIAGNOSTICS_DIR: ${{ github.workspace }}/integration-diagnostics
      CI_STACK_REPORTS_DIR: ${{ github.workspace }}/integration-reports
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: "1.58.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          name: rapida-integration-${{ github.run_id }}-${{ github.run_attempt }}
          driver: docker-container
          install: true

      - name: Run all-service integration
        run: just ci-integration

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-diagnostics
          if-no-files-found: warn
          retention-days: 7

  smoke:
    name: Smoke Tests
    needs: all-service-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: rapida-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      CI_STACK_AUTH_TOKEN: ci-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      CI_STACK_CACHE_SCOPE: end-to-end-${{ github.run_id }}-${{ github.run_attempt }}
      CI_STACK_DIAGNOSTICS_DIR: ${{ github.workspace }}/smoke-diagnostics
      CI_STACK_REPORTS_DIR: ${{ github.workspace }}/smoke-reports
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: "1.58.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          name: rapida-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          driver: docker-container
          install: true

      - name: Run smoke tests
        run: just ci-smoke

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload smoke diagnostics
        if: failure() && hashFiles('smoke-diagnostics/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-diagnostics
          if-no-files-found: error
          retention-days: 7
