name: Workflow Lint

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/dependabot.yml
      - .github/workflows/**
      - justfile
      - just/**
  push:
    branches:
      - main
      - develop
    paths:
      - .github/actions/**
      - .github/dependabot.yml
      - .github/workflows/**
      - justfile
      - just/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.13"
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: "1.58.0"

      - name: Lint workflows and recipes
        run: |
          actionlint -color
          just --fmt --check
          bash -n just/*.sh
          shellcheck just/*.sh
