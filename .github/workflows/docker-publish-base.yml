name: Push Base Images

on:
  push:
    branches:
      - main
    paths:
      - "docker/base/**"
      - ".github/actions/docker-build/action.yml"
      - ".github/workflows/docker-publish-base.yml"
  workflow_dispatch:
    inputs:
      images:
        description: "Images to rebuild: all or comma-separated golang-bookworm,golang-alpine,alpine,debian-slim,node-alpine,python"
        required: false
        default: all

permissions:
  contents: read

env:
  REGISTRY: rapidaai

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      golang-bookworm: ${{ steps.set.outputs.golang-bookworm }}
      golang-alpine: ${{ steps.set.outputs.golang-alpine }}
      alpine: ${{ steps.set.outputs.alpine }}
      debian-slim: ${{ steps.set.outputs.debian-slim }}
      node-alpine: ${{ steps.set.outputs.node-alpine }}
      python: ${{ steps.set.outputs.python }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed base images
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            golang-bookworm:
              - "docker/base/rapida-golang-bookworm.Dockerfile"
            golang-alpine:
              - "docker/base/rapida-golang-alpine.Dockerfile"
            alpine:
              - "docker/base/rapida-alpine.Dockerfile"
            debian-slim:
              - "docker/base/rapida-debian-slim.Dockerfile"
            node-alpine:
              - "docker/base/rapida-node-alpine.Dockerfile"
            python:
              - "docker/base/rapida-python.Dockerfile"

      - name: Set rebuild targets
        id: set
        run: |
          set -euo pipefail

          select_image() {
            local name="$1"
            if [ "$REBUILD_ALL" = "true" ] || printf '%s' "$INPUT" | tr ',' '\n' | grep -qx "$name"; then
              echo "${name}=true"
            else
              echo "${name}=false"
            fi
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.images }}"
            if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
              REBUILD_ALL=true
            else
              REBUILD_ALL=false
            fi
            {
              select_image golang-bookworm
              select_image golang-alpine
              select_image alpine
              select_image debian-slim
              select_image node-alpine
              select_image python
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "golang-bookworm=${{ steps.filter.outputs.golang-bookworm }}"
              echo "golang-alpine=${{ steps.filter.outputs.golang-alpine }}"
              echo "alpine=${{ steps.filter.outputs.alpine }}"
              echo "debian-slim=${{ steps.filter.outputs.debian-slim }}"
              echo "node-alpine=${{ steps.filter.outputs.node-alpine }}"
              echo "python=${{ steps.filter.outputs.python }}"
            } >> "$GITHUB_OUTPUT"
          fi

  push-golang-bookworm:
    name: Push rapida-golang:1.25.12-bookworm
    needs: changes
    if: needs.changes.outputs.golang-bookworm == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: ./docker/base/rapida-golang-bookworm.Dockerfile
          push: "true"
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/rapida-golang:1.25.12-bookworm
          cache-scope: rapida-golang-bookworm
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  push-golang-alpine:
    name: Push rapida-golang:1.25.12-alpine
    needs: changes
    if: needs.changes.outputs.golang-alpine == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: ./docker/base/rapida-golang-alpine.Dockerfile
          push: "true"
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/rapida-golang:1.25.12-alpine
          cache-scope: rapida-golang-alpine
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  push-alpine:
    name: Push rapida-alpine:3.21
    needs: changes
    if: needs.changes.outputs.alpine == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: ./docker/base/rapida-alpine.Dockerfile
          push: "true"
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/rapida-alpine:3.21
          cache-scope: rapida-alpine
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  push-debian-slim:
    name: Push rapida-debian:bookworm-slim
    needs: changes
    if: needs.changes.outputs.debian-slim == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: ./docker/base/rapida-debian-slim.Dockerfile
          push: "true"
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/rapida-debian:bookworm-slim
          cache-scope: rapida-debian-slim
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  push-node-alpine:
    name: Push rapida-node:22-alpine
    needs: changes
    if: needs.changes.outputs.node-alpine == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: ./docker/base/rapida-node-alpine.Dockerfile
          push: "true"
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/rapida-node:22-alpine
          cache-scope: rapida-node-alpine
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  push-python:
    name: Push rapida-python:3.11
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: ./docker/base/rapida-python.Dockerfile
          push: "true"
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/rapida-python:3.11
          cache-scope: rapida-python
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - push-golang-bookworm
      - push-golang-alpine
      - push-alpine
      - push-debian-slim
      - push-node-alpine
      - push-python
    steps:
      - name: Write summary
        run: |
          {
            echo "## Base Images"
            echo ""
            echo "| Image | Result |"
            echo "|-------|--------|"
            echo "| rapidaai/rapida-golang:1.25.12-bookworm | ${{ needs.push-golang-bookworm.result }} |"
            echo "| rapidaai/rapida-golang:1.25.12-alpine | ${{ needs.push-golang-alpine.result }} |"
            echo "| rapidaai/rapida-alpine:3.21 | ${{ needs.push-alpine.result }} |"
            echo "| rapidaai/rapida-debian:bookworm-slim | ${{ needs.push-debian-slim.result }} |"
            echo "| rapidaai/rapida-node:22-alpine | ${{ needs.push-node-alpine.result }} |"
            echo "| rapidaai/rapida-python:3.11 | ${{ needs.push-python.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
