name: System test phase
description: Runs one deadline-aware phase of the stack-owning system test.

inputs:
  phase:
    description: System test phase to execute.
    required: true

runs:
  using: composite
  steps:
    - name: "Run ${{ inputs.phase }}"
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/run-phase.sh" "${{ inputs.phase }}"
