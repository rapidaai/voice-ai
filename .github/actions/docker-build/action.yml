name: Docker build
description: Build a Docker image, with optional Docker Hub login and push.

inputs:
  context:
    description: Docker build context.
    required: false
    default: .
  dockerfile:
    description: Path to the Dockerfile.
    required: true
  push:
    description: Whether to push the built image.
    required: false
    default: "false"
  tags:
    description: Newline-separated image tags.
    required: true
  build-args:
    description: Newline-separated Docker build arguments.
    required: false
    default: ""
  platforms:
    description: Target platforms for buildx.
    required: false
    default: ""
  cache-scope:
    description: GitHub Actions cache scope for BuildKit layers.
    required: true
  registry-username:
    description: Docker registry username. Required when push is true.
    required: false
    default: ""
  registry-password:
    description: Docker registry password or token. Required when push is true.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

    - name: Validate registry credentials
      if: inputs.push == 'true'
      shell: bash
      env:
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
      run: |
        if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
          echo "registry-username and registry-password are required when push is true"
          exit 1
        fi

    - name: Log in to Docker registry
      if: inputs.push == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build Docker image
      if: inputs.platforms == ''
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=max

    - name: Build Docker image for platforms
      if: inputs.platforms != ''
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ inputs.tags }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=max
