name: Documentation
description: Report missing, unclear, or incorrect docs.
title: "docs: "
labels:
  - documentation
body:
  - type: textarea
    id: issue
    attributes:
      label: Documentation issue
      description: What is missing, unclear, or incorrect?
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: Link, file path, section, or command related to the docs.
    validations:
      required: false

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: What would make this clearer?
    validations:
      required: false
