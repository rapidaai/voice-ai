minimum_pre_commit_version: "2.20.0"
default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push
default_stages:
  - commit

repos:
  - repo: local
    hooks:
      - id: merge-conflict-markers
        name: Check for merge conflict markers
        entry: bash bin/pre-commit-hygiene merge-conflict
        language: system
        pass_filenames: true

      - id: private-key
        name: Detect private keys
        entry: bash bin/pre-commit-hygiene private-key
        language: system
        pass_filenames: true

      - id: common-secrets
        name: Detect common secret tokens
        entry: bash bin/pre-commit-hygiene secrets
        language: system
        pass_filenames: true

      - id: check-json
        name: Validate JSON files
        entry: bash bin/pre-commit-hygiene json
        language: system
        files: \.json$
        exclude: (^|/)(tsconfig|jsconfig)\.json$
        pass_filenames: true

      - id: check-shell
        name: Validate shell script syntax
        entry: bash bin/pre-commit-hygiene shell-syntax
        language: system
        files: \.sh$
        pass_filenames: true

      - id: agent-style
        name: Validate added prose and identifier style
        entry: python3 bin/check-agent-style --staged
        language: system
        always_run: true
        pass_filenames: false

      - id: agent-drift
        name: Detect agent tooling and generated-rule drift
        entry: python3 bin/check-agent-drift
        language: system
        files: ^(\.claude/|\.codex/|\.github/|agent-rules\.json|agent-tooling-manifest\.json|agent-reviewers\.example\.json|AGENTS\.md|AGENT_LESSONS\.md|AGENT_TOOLING\.md|CLAUDE\.md|DEVELOPMENT_PROCESS\.md|SKILLS_QUICKSTART\.md|bin/|githooks/|just/|tests/agent_tooling/|ui/e2e/|ui/playwright\.config\.ts)
        pass_filenames: false

      - id: go-version-consistency
        name: Verify Go and base-image versions match
        entry: bash bin/check-go-version-consistency
        language: system
        always_run: true
        pass_filenames: false

      - id: gofmt
        name: Check Go formatting
        entry: bash bin/pre-commit-go fmt
        language: system
        files: \.go$
        exclude: ^(protos/|sdks/|vendor/)
        pass_filenames: true

      - id: go-mod-tidy
        name: Verify go.mod and go.sum are tidy
        entry: bash bin/pre-commit-go mod-tidy
        language: system
        files: ^(go\.mod|go\.sum|.*\.go)$
        pass_filenames: false

      - id: go-formatters
        name: Run golangci-lint formatters (strict)
        entry: bash bin/pre-commit-go formatters
        language: system
        files: \.go$
        pass_filenames: false
        stages:
          - manual

      - id: golangci-lint
        name: Run golangci-lint on CI-safe Go packages (strict)
        entry: bash bin/pre-commit-go lint
        language: system
        files: \.go$
        pass_filenames: false
        stages:
          - manual

      - id: go-vet
        name: Run go vet on CI-safe Go packages
        entry: bash bin/pre-commit-go vet
        language: system
        files: \.go$
        pass_filenames: false
        stages:
          - push

      - id: go-test
        name: Run Go tests on CI-safe Go packages (strict)
        entry: bash bin/pre-commit-go test
        language: system
        files: \.go$
        pass_filenames: false
        stages:
          - manual

      - id: go-security-scan
        name: Scan changed Go packages for security issues
        entry: bash bin/pre-commit-go security
        language: system
        require_serial: true
        files: \.go$
        exclude: ^(protos/|sdks/|vendor/)
        pass_filenames: true

      - id: go-vulnerability-scan
        name: Check Go dependencies for known vulnerabilities
        entry: bash bin/pre-commit-go vuln
        language: system
        files: ^(go\.mod|go\.sum|.*\.go)$
        exclude: ^(protos/|sdks/|vendor/)
        pass_filenames: false

      - id: go-build
        name: Build CI Go binaries
        entry: bash bin/pre-commit-go build
        language: system
        files: \.go$
        pass_filenames: false
        stages:
          - push

      - id: agent-pr-ready
        name: Validate branch readiness before push
        entry: bash bin/agent-pr-ready
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - push

      - id: commit-msg
        name: Validate commit message format
        entry: bash githooks/commit-msg
        language: system
        stages:
          - commit-msg
        always_run: true
        pass_filenames: true
